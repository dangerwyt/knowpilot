services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knowpilot
      POSTGRES_USER: knowpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowpilot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    command: >
      etcd
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://milvus-etcd:2379
      --listen-peer-urls http://0.0.0.0:2380
      --initial-advertise-peer-urls http://milvus-etcd:2380
      --initial-cluster default=http://milvus-etcd:2380
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    restart: unless-stopped

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    command: minio server /minios --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [milvus_minio:/minios]
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.6
    command: ["milvus", "run", "standalone"]
    ports: ["19530:19530"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes: [milvus_data:/var/lib/milvus]
    restart: unless-stopped
    depends_on: [milvus-etcd, milvus-minio]

  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://knowpilot:${POSTGRES_PASSWORD}@postgres/knowpilot
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
    ports: ["8000:8000"]
    volumes: [./backend:/app]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      milvus: { condition: service_started }

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://knowpilot:${POSTGRES_PASSWORD}@postgres/knowpilot
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
    volumes: [./backend:/app]
    # --pool=solo 是硬约束，不是优化：多进程 worker 会并发消费同一队列，
    # 本项目"单 worker 串行"的前提（见 docs/踩坑记录.md #14）在容器里同样成立。
    command: celery -A app.services.task_queue.celery_app worker --pool=solo --loglevel=info
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    volumes: [./frontend:/app]
    environment:
      VITE_API_BASE: http://localhost:8000/api/v1
    command: npm run dev -- --host

volumes:
  pg_data:
  milvus_data:
  milvus_minio:
  minio_data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1450