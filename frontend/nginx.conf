# KnowPilot 前端生产配置（nginx）
#
# 两个职责：
#   1. /             → 托管 vite build 的静态产物
#   2. /api/*        → 反代到 backend:8000（后端不用改：前端用的是相对路径 /api/v1）
#
# 由 frontend/Dockerfile.prod 拷进 /etc/nginx/conf.d/default.conf。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传文档的体积上限。后端没有做大小校验、uvicorn 也不拦，
    # 这里是唯一的闸门 —— nginx 默认只有 1m，几 MB 的 PDF 会被直接 413。
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # 注意 gzip_proxied 默认就是 off ⇒ 反代回来的响应（含 SSE）不会被压缩，正合我们需要

    # ---------------------------------------------------------------- 前端页面
    location / {
        # vue-router 用的 history 模式：直接刷新 /projects 这类地址时磁盘上没有对应文件，
        # 一律回 index.html 交给前端路由，否则刷新就 404。
        try_files $uri $uri/ /index.html;
    }

    # 入口文件绝不缓存，否则发新版后浏览器还拿着旧的 index.html
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # vite 产物文件名带内容 hash，内容一变文件名就变，可以放心长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------------------------------------------------------------- SSE 事件流
    # 正则 location 的优先级高于前缀 location，所以这段会盖住下面的 /api/。
    #
    # 为什么必须单列：nginx 默认 proxy_buffering on，会把 text/event-stream 攒在
    # 缓冲区里。前端看到的现象是「时间线半天不动、最后一次性全冒出来」，
    # 而 DevTools 里请求状态一直挂着 pending —— 排查时很像后端卡住了，其实是这里。
    location ~ ^/api/v1/tasks/[^/]+/events$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Authorization 与 Last-Event-ID（断点续传）靠默认透传即可，别在这里 set 掉

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------------------------------------------------------------- API 反代
    # proxy_pass 末尾不写 / ⇒ URI 原样转发：/api/v1/x → backend:8000/api/v1/x
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 建任务 / 出报告这类同步调用可能超过默认的 60s
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
